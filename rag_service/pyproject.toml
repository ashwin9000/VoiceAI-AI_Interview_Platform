[project]
name = "rag-service"
version = "0.1.0"
description = "Interview History RAG Chatbot — FastAPI microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "langgraph>=0.4",
    "langchain-google-genai>=2.1",
    "langchain-chroma>=0.2",
    "chromadb>=1.0",
    "pymongo>=4.9",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
